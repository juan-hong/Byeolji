<div id="app">
  <aside id="panel" aria-label="Byeolji">
    <div class="backdrop" aria-hidden="true"></div>
    <header class="ph">
      <a class="brand" href="/en/">Byeolji</a>
      <a id="btn-guide" class="ib" href="/en/guide/"><svg><use href="#i-help"/></svg></a>
      <button id="btn-settings" class="ib" type="button"><svg><use href="#i-gear"/></svg></button>

      <button id="close-panel" class="ib only-narrow" type="button"><svg><use href="#i-min"/></svg></button>
    </header>

    <!-- 목록 -->
    <div id="view-main" class="view">
      <div class="tools">
        <label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off"></label>
        <div class="region-wrap">
          <button id="region-btn" class="region-bar" type="button"></button>
          <div id="region-menu" class="menu" hidden></div>
        </div>
        <div class="sel-bar"><span id="sel-count"></span><button id="clear" class="link" type="button" data-t="clearAll"></button></div>
        <div class="divider"><i></i></div>
      </div>
      <div class="scroll">
        <div id="top-cards"></div>
        <div id="sections"></div>
        <div class="ad-slot" data-ad="map"></div>
      </div>
    </div>

    <!-- 설정 -->
    <div id="view-settings" class="view" hidden>
      <div class="scroll pad">
        <button class="back" type="button" data-back><svg><use href="#i-back"/></svg><span data-t="back"></span></button>
        <h2 data-t="settings"></h2>
        <h4 data-t="language"></h4><div class="chips" id="set-lang"></div>
        <h4 data-t="layout"></h4><div class="chips" id="set-layout"></div>
        <h4 data-t="uiScale"></h4><div class="chips" id="set-ui"></div>
        <h4 data-t="textScale"></h4><div class="chips" id="set-text"></div>
        <h4 data-t="theme"></h4><div class="themes" id="set-theme"></div>
        <h4 data-t="mapOptions"></h4>
        <label class="row-switch"><span data-t="hideCollected"></span><input id="hide-done" type="checkbox" class="sw"></label>
        <h4 data-t="about"></h4>
        <p class="note" data-t="unofficial"></p>
        <p class="links"><button class="link" type="button" id="show-guide" data-t="showGuide"></button> · <a id="privacy" href="#" target="_blank" rel="noopener" data-t="privacy"></a> · <a href="/en/download/" data-t="getApp"></a></p>
        <div id="donate"></div>
      </div>
    </div>

    <!-- 계정 (account.js 가 채움) -->
    <div id="view-account" class="view" hidden>
      <div class="scroll pad">
        <button class="back" type="button" data-back><svg><use href="#i-back"/></svg><span data-t="back"></span></button>
        <h2 data-t="account"></h2>
        <div id="account-box"></div>
      </div>
    </div>
  </aside>
  <main id="map"></main>
  <button id="open-panel" class="fab only-narrow" type="button" aria-label="Byeolji"><img src="/icon.png" alt=""></button>
