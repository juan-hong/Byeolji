<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byeolji 지도 · 원신 인터랙티브 맵</title>
<meta name="description" content="원신 자원 위치 지도. 보물상자·눈동자·특산물 등 위치를 보고 획득한 곳을 체크하면 별지 PC·안드로이드 앱과 동기화됩니다.">
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="map.css">
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="분류">
    <header class="ph">
      <a class="brand" href="/"><img src="/icon.png" alt="" width="26" height="26">Byeolji</a>
      <select id="lang" aria-label="Language">
        <option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option>
        <option value="ru">Русский</option><option value="id">Bahasa Indonesia</option><option value="es">Español</option>
      </select>
      <button id="account" class="ghost" type="button"></button>
      <button id="close-panel" class="icon only-narrow" type="button" aria-label="Close">✕</button>
    </header>
    <div id="account-box" hidden></div>
    <div class="tools">
      <input id="search" type="search" autocomplete="off">
      <select id="region"></select>
      <label class="switch"><input id="hide-done" type="checkbox"><span data-t="hideDone"></span></label>
      <div class="sel-bar"><span id="sel-count"></span><button id="clear" class="ghost" type="button" data-t="hideAll"></button></div>
    </div>
    <div id="sections"></div>
    <footer class="pf"><span data-t="syncNote"></span> <a href="/" data-t="getApp"></a></footer>
  </aside>
  <main id="map"></main>
  <button id="open-panel" class="fab only-narrow" type="button" aria-label="Categories">☰</button>
  <div id="toast" role="status" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="map.js"></script>
<script type="module" src="account.js"></script>
</body>
</html>
