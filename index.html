<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="naver-site-verification" content="f049a4efc02ebd072002f13bef9f6113899d6d13">
<title>Byeolji · 게임 지도</title>
<meta name="description" content="별지(Byeolji): 원신 자원 지도와 게임 위에 띄우는 지도 앱. 웹·PC·안드로이드 어디서든 같은 계정으로 기록이 이어집니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Byeolji">
<meta property="og:url" content="https://byeolji.app/">
<meta property="og:title" content="Byeolji · 게임 지도">
<meta property="og:description" content="원신 자원 지도 · Genshin Impact interactive map, synced with the Byeolji PC and Android apps">
<meta property="og:image" content="https://byeolji.app/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  .hub { max-width: 1040px; margin: 0 auto; padding: 0 20px 64px; }
  .hub-top { display: flex; align-items: center; gap: 14px; padding: 18px 0; }
  .hub-top .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; text-decoration: none; margin-right: auto; }
  .hub-top .brand img { border-radius: 7px; }
  .hub-top a.app { color: var(--dim); text-decoration: none; }
  .hub-top a.app:hover { color: var(--text); }
  .hub-top select { background: transparent; color: var(--text); border: 1px solid rgba(234, 227, 204, .25); border-radius: 7px; padding: 4px 6px; font: inherit; }
  .hub-top option { background: var(--ink); }
  .hero { text-align: center; padding: 56px 0 40px; }
  .hero img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
  .hero h1 { font-size: clamp(30px, 6vw, 46px); margin: 18px 0 6px; letter-spacing: .02em; }
  .hero p { color: var(--dim); margin: 0; }
  .pick { color: var(--gold); text-align: center; margin: 8px 0 18px; font-size: 15px; }
  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .game {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 220px; padding: 18px;
    border: 1px solid rgba(234, 227, 204, .22); border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--text);
    background: linear-gradient(180deg, rgba(11, 37, 46, 0) 30%, rgba(11, 37, 46, .92) 85%), var(--bg, #123744) center / cover no-repeat;
    transition: transform .2s var(--ease), border-color .2s;
  }
  a.game:hover { transform: translateY(-3px); border-color: var(--gold); }
  .game h2 { margin: 0; font-size: 21px; }
  .game span { color: var(--dim); font-size: 14px; }
  .game .go { color: var(--gold); }
  .game.soon { filter: saturate(.3); opacity: .7; cursor: default; }
  .game .tag { position: absolute; top: 14px; right: 14px; font-size: 12px; border: 1px solid rgba(234, 227, 204, .4); border-radius: 99px; padding: 1px 10px; }
  .sync { margin: 40px auto 0; max-width: 640px; text-align: center; color: var(--dim); font-size: 15px; }
  .sync a { color: var(--gold); }
</style>
</head>
<body>
<div class="hub">
  <header class="hub-top">
    <a class="brand" href="/"><img src="/icon.png" alt="" width="30" height="30">Byeolji</a>
    <a class="app" href="/app/" data-t="pcApp">PC 앱</a>
    <select id="lang" aria-label="Language">
      <option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option>
      <option value="ru">Русский</option><option value="id">Bahasa Indonesia</option><option value="es">Español</option>
    </select>
  </header>

  <section class="hero">
    <img src="/icon.png" alt="Byeolji">
    <h1>Byeolji</h1>
    <p data-t="tagline">게임 지도 위에 띄우는 별 하나</p>
  </section>

  <p class="pick" data-t="pick">게임을 고르세요</p>
  <div class="games">
    <a class="game" href="/genshin/map/" style="--bg: url('/shots/mond.webp')">
      <h2 data-t="genshin">원신</h2>
      <span><span data-t="genshinDesc">자원 지도 · PC 오버레이 · 안드로이드</span> <span class="go">→</span></span>
    </a>
    <div class="game soon" aria-disabled="true">
      <span class="tag" data-t="soon">준비 중</span>
      <h2 data-t="wuwa">명조</h2>
    </div>
    <div class="game soon" aria-disabled="true">
      <span class="tag" data-t="soon">준비 중</span>
      <h2 data-t="hsr">붕괴: 스타레일</h2>
    </div>
  </div>

  <p class="sync"><span data-t="sync">웹·PC·안드로이드 어디서든 같은 계정으로 획득 기록이 이어집니다.</span> <a href="/app/" data-t="getApp">PC 앱 받기</a></p>
</div>
<script>
(() => {
  const S = {
    en: { pcApp: 'PC app', tagline: 'A star on your game map', pick: 'Choose a game', genshin: 'Genshin Impact', genshinDesc: 'Resource map · PC overlay · Android',
      soon: 'Coming soon', wuwa: 'Wuthering Waves', hsr: 'Honkai: Star Rail', sync: 'Your found spots stay in sync across web, PC and Android with one account.', getApp: 'Get the PC app' },
    ja: { pcApp: 'PCアプリ', tagline: 'ゲームマップに浮かぶひとつの星', pick: 'ゲームを選んでください', genshin: '原神', genshinDesc: '資源マップ · PCオーバーレイ · Android',
      soon: '準備中', wuwa: '鳴潮', hsr: '崩壊：スターレイル', sync: 'Web・PC・Android でひとつのアカウントに記録が同期されます。', getApp: 'PCアプリ' },
    zh: { pcApp: 'PC 应用', tagline: '游戏地图上的一颗星', pick: '选择游戏', genshin: '原神', genshinDesc: '资源地图 · PC 悬浮窗 · 安卓',
      soon: '即将推出', wuwa: '鸣潮', hsr: '崩坏：星穹铁道', sync: '网页、PC、安卓同一账号同步获取记录。', getApp: '下载 PC 应用' },
    ru: { pcApp: 'Приложение для ПК', tagline: 'Звезда на карте вашей игры', pick: 'Выберите игру', genshin: 'Genshin Impact', genshinDesc: 'Карта ресурсов · оверлей для ПК · Android',
      soon: 'Скоро', wuwa: 'Wuthering Waves', hsr: 'Honkai: Star Rail', sync: 'Отметки синхронизируются между вебом, ПК и Android по одному аккаунту.', getApp: 'Скачать для ПК' },
    id: { pcApp: 'Aplikasi PC', tagline: 'Sebuah bintang di peta gimmu', pick: 'Pilih gim', genshin: 'Genshin Impact', genshinDesc: 'Peta sumber daya · overlay PC · Android',
      soon: 'Segera hadir', wuwa: 'Wuthering Waves', hsr: 'Honkai: Star Rail', sync: 'Tanda temuanmu tersinkron di web, PC, dan Android dengan satu akun.', getApp: 'Unduh aplikasi PC' },
    es: { pcApp: 'App de PC', tagline: 'Una estrella en el mapa de tu juego', pick: 'Elige un juego', genshin: 'Genshin Impact', genshinDesc: 'Mapa de recursos · overlay de PC · Android',
      soon: 'Próximamente', wuwa: 'Wuthering Waves', hsr: 'Honkai: Star Rail', sync: 'Tus hallazgos se sincronizan en web, PC y Android con una sola cuenta.', getApp: 'Descargar para PC' },
  };
  const LANGS = ['ko', 'en', 'ja', 'zh', 'ru', 'id', 'es'];
  const ko = {};
  document.querySelectorAll('[data-t]').forEach((el) => { ko[el.dataset.t] = el.textContent; });
  const pick = () => {
    const q = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(q)) return q;
    try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch {}
    for (const l of navigator.languages || ['en']) { const b = l.slice(0, 2).toLowerCase(); if (LANGS.includes(b)) return b; }
    return 'en';
  };
  const apply = (lang) => {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = (S[lang] || ko)[el.dataset.t] ?? ko[el.dataset.t]; });
    document.getElementById('lang').value = lang;
  };
  document.getElementById('lang').addEventListener('change', (e) => {
    try { localStorage.setItem('lang', e.target.value); } catch {}
    apply(e.target.value);
  });
  apply(pick());
})();
</script>
</body>
</html>
